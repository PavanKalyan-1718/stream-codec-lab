[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-codec-lab"
version = "0.1.0"
description = "Reproducible compression benchmarks for event-stream workloads."
requires-python = ">=3.10"
authors = [{name = "Pavan Kalyan"}]

[project.scripts]
stream-codec-bench = "stream_codec_lab.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

